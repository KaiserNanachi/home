ar(--line);font-size:13px}.q-review h3{font-size:14px;margin:6px 0}.source-card{font-size:13px;border-bottom:1px solid var(--line);padding:20px 0}.source-card:last-child{border:0}.source-card h3{font-size:14px;margin-bottom:9px}.source-card blockquote{margin:12px 0;background:#f0f4f1;padding:12px 16px;border-left:3px solid var(--green);font-size:13px}.source-card a{overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.empty{padding:35px;text-align:center;color:var(--muted)}.storage-note{font-size:12px;color:var(--muted);margin-top:10px}.mobile-backdrop{display:none}.toast{position:fixed;right:25px;bottom:24px;background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100vw - 40px);box-shadow:var(--shadow)}.print-only{display:none}

<script>
const M = [
{id:'prob',group:'確率と推測',title:'事象・条件付き確率',lead:'条件を置くと、分母に使う集団が変わる。まず事象を定義してから式を選ぶ。',lab:'bayes',terms:'独立 条件付き確率 ベイズの定理 包除原理',goal:'P(A|B)とP(B|A)を区別し、全確率を使って分母を構成する。',example:'設備の故障率1%、故障を検出する確率90%、正常設備の誤警報率5%。警報が出た設備の故障確率は0.009/(0.009+0.0495)=約15.38%。',sections:[
['条件と独立','P(A|B)=P(A∩B)/P(B)（P(B)>0）。独立とはP(A∩B)=P(A)P(B)。排反とはA∩B=∅であり、両事象の確率が正なら独立にはならない。','P(A∪B)=P(A)+P(B)−P(A∩B)'],
['ベイズの定理','原因Aから結果Bを予測する確率P(B|A)を、結果Bから原因Aを推測する確率P(A|B)へ変換する。分母はBが起こるすべての経路を足す。','P(A|B)=P(B|A)P(A) / {P(B|A)P(A)+P(B|Aᶜ)P(Aᶜ)}'],
['全期待値・全分散','条件ごとの平均を重み付けして全体平均を得る。全分散は「条件内のばらつき」と「条件平均間のばらつき」の和になる。','E[X]=E[E(X|Z)]　／　Var(X)=E[Var(X|Z)]+Var[E(X|Z)]']],pitfall:'検出率90%を「警報時に故障している確率90%」と読み替えない。基礎発生率も必要。',source:['old','new']},
{id:'dist',group:'確率と推測',title:'確率分布・標本分布',lead:'何を数えるか、どこに値を取るか、独立かを確認して分布を決める。',lab:'distributions',terms:'二項 ポアソン 超幾何 幾何 負の二項 多項 正規 指数 ガンマ ベータ t カイ二乗 F 非心',goal:'分布の支持・パラメータ・平均・分散と、標本分布の構成を説明する。',example:'独立な20設備がそれぞれ故障確率0.1なら故障台数はBin(20,0.1)。平均2、分散1.8。一定率の発生を時間内で数えるならPoisson(λt)を検討する。',sections:[
['離散分布の使い分け','二項：固定回数の独立な成功数。超幾何：有限母集団から非復元抽出する成功数。幾何：初成功までの試行数。負の二項：r回成功するまでの失敗数。多項：固定回数を複数カテゴリに分ける度数。','Bin(n,p): E[X]=np, Var(X)=np(1−p)　／　Pois(λ): E[X]=Var(X)=λ'],
['待ち時間と連続分布','指数分布の率λは単位時間当たりの発生率で、平均は1/λ。Gamma(a,b)はこの教材では形状a・率bを用い、平均a/b、分散a/b²。Beta(a,b)は0〜1の比率のモデル。正規分布N(μ,σ²)の第2引数は分散。','Exp(λ): P(X>t)=e⁻λᵗ　／　Beta(a,b): E[X]=a/(a+b)'],
['t・χ²・Fの生成','Zが標準正規、Uが自由度νのχ²で独立ならZ/√(U/ν)はtν。独立なχ²変数U,Vを各自由度で割った比はF。正規母集団からの標本では標本平均と不偏分散が独立。','(n−1)S²/σ² ∼ χ²(n−1)　／　( X̄−μ )/(S/√n) ∼ t(n−1)'],
['その他の分布','一様分布は区間内の密度が一定。対数正規はlog Xが正規。コーシー分布には有限の平均・分散が存在しない。多変量正規は平均ベクトルと共分散行列で決まる。非心分布は対立仮説下の検定力計算などに現れる。','X∼Lognormal(μ,σ²) ⇒ E[X]=exp(μ+σ²/2)']],pitfall:'率と尺度は逆数。幾何・負の二項は「試行数」「失敗数」のどちらを数えるかを必ず明記する。',source:['old','new','norm']},
{id:'transform',group:'確率と推測',title:'期待値・母関数・変数変換',lead:'分布を丸暗記する前に、積分・母関数・ヤコビアンで変換を追う。',lab:'transform',terms:'MGF PGF 歪度 尖度 変動係数 偏相関 分位点 ヤコビアン Box-Cox',goal:'線形結合の分散と密度の変換を計算し、独立と無相関を区別する。',example:'X∼Exp(2)、Y=3XならfY(y)=(2/3)exp(−2y/3)（y≥0）。平均は1.5。変換後の密度には微分の係数1/3が必要。',sections:[
['線形結合と相関','期待値の線形性に独立性は不要。分散には共分散の項が加わる。無相関は一般には独立を意味しないが、同時正規なら無相関から独立が導ける。','Var(aX+bY)=a²Var(X)+b²Var(Y)+2abCov(X,Y)'],
['母関数','モーメント母関数M(t)=E[eᵗˣ]が0の近傍で存在すると、k階微分のt=0での値がE[Xᵏ]。独立な和では母関数を掛ける。非負整数の確率母関数G(s)=E[sˣ]の微分は階乗モーメントを与える。','M(X+Y)(t)=M_X(t)M_Y(t)（独立な場合）'],
['変数変換・順序統計','単調な変換Y=g(X)では逆関数の微分の絶対値を掛ける。多次元ではヤコビアンの行列式の絶対値を使う。非単調なら各逆像の寄与を足す。独立同分布n個の最大値のCDFはF(x)ⁿ。','fY(y)=fX(g⁻¹(y)) |d g⁻¹(y)/dy|'],
['特性値の読み方','歪度は標準化した3次中心モーメント。尖度は標準化した4次中心モーメントで、超過尖度はそこから3を引く。変動係数σ/μはμ>0の比率尺度で使う。偏相関は第三の変数の線形な影響を除いた残差同士の相関。','ρXY·Z=(ρXY−ρXZρYZ)/√{(1−ρXZ²)(1−ρYZ²)}'],
['Box–Cox変換〔2027明記〕','正の値に対して、λ≠0なら(x^λ−1)/λ、λ=0ならlog xを用いる。平均構造や分散の変化を扱うための変換であり、変換だけで独立性が成立するわけではない。','gλ(x)=(x^λ−1)/λ　／　g0(x)=log x']],pitfall:'密度の高さは確率ではない。確率は区間の面積であり、密度は1を超えてもよい。',source:['old','new']},
{id:'clt',group:'確率と推測',title:'大数の法則・漸近理論',lead:'平均の収束と、標準化した誤差の分布の収束は別の主張。',lab:'clt',terms:'大数 中心極限 少数法則 正規近似 連続修正 デルタ法 概収束 確率収束 Slutsky 極値',goal:'極限定理の仮定を確認し、標準誤差と変換後の漸近分散を求める。',example:'Xiが独立同分布のExp(1)なら平均1・分散1。X̄の平均は1、標準誤差は1/√n。n=100なら約0.1。元の分布が非対称でも、標準化した平均は正規分布に近づく。',sections:[
['大数と中心極限','有限分散の独立同分布を仮定するとX̄はμに確率収束し、√n(X̄−μ)/σはN(0,1)に分布収束する。母分布自体が正規分布へ変わるという意味ではない。','X̄ →p μ　／　√n(X̄−μ)/σ →d N(0,1)'],
['離散分布の近似','Bin(n,p)を平均np・分散np(1−p)の正規分布で近似する。離散のP(X≤k)にはk+0.5で連続修正する。n→∞、p→0、np→λなら二項分布はPoisson(λ)へ収束する。','P(X≤k) ≈ Φ{(k+0.5−np)/√[np(1−p)]}'],
['デルタ法','√n(θ̂−θ)が漸近正規で分散vなら、滑らかなgについて√n{g(θ̂)−g(θ)}の漸近分散は[g′(θ)]²v。導関数が0ならこの一次の近似では非退化な分布を得られず、別の展開が必要。','Var[g(θ̂)] ≈ [g′(θ)]² Var(θ̂)'],
['収束と補題〔2027明記〕','概収束⇒確率収束⇒分布収束。確率極限が定数である場合の組合せにスルツキーの補題を使う。連続写像定理は連続な変換後にも収束を伝える。極値の漸近分布は和や平均とは異なり、Gumbel・Fréchet・Weibull型などを使う。','Zn →d Z, An →p a ⇒ AnZn →d aZ']],pitfall:'nが大きいだけでは依存や無限分散の問題は解消しない。系列データでは独立同分布の標準誤差をそのまま使えない。',source:['old','new']},
{id:'estimate',group:'確率と推測',title:'点推定・尤度・情報量',lead:'推定値が近いかを、バイアスと分散に分解して評価する。',lab:'likelihood',terms:'最尤 モーメント 十分統計量 不偏 一致 CR不等式 フィッシャー情報 KL バイアス バリアンス',goal:'尤度を最大化し、推定量の性質を区別する。',example:'独立なBernoulli(p)の20観測で成功が7回。対数尤度は7log p+13log(1−p)。微分を0にするとp̂=7/20=0.35。成功回数はpの十分統計量。',sections:[
['最尤法とモーメント法','観測値を固定して、パラメータの関数として尤度を最大化する。モーメント法は標本モーメントと理論モーメントを等置する。最尤推定が常に不偏というわけではない。','ℓ(p)=s log p+(n−s)log(1−p)　⇒　p̂=s/n'],
['不偏・一致・平均二乗誤差','不偏性は各nでE[θ̂]=θ。一致性はn→∞でθ̂→pθ。MSEは分散とバイアス²の和なので、多少のバイアスを許して分散を下げる推定がMSEで優れる場合がある。','MSE(θ̂)=Var(θ̂)+{E[θ̂]−θ}²'],
['十分統計量・分解定理','尤度がg(T(x),θ)h(x)と分解できればTは十分統計量。正規母集団の未知平均・既知分散ではΣXiが十分。順序統計量はデータを大小順に並べた確率変数で、最小値・最大値や標本分位点を扱う。','f(x;θ)=g(T(x);θ)h(x)'],
['情報量と下限','正則条件の下でI(θ)=E[(∂ℓ/∂θ)²]=−E[∂²ℓ/∂θ²]。不偏推定量の分散は1/I_n(θ)以上。MLEは正則条件の下で漸近分散1/I_n(θ)。KL(P‖Q)は対称ではなく、0以上。','Bernoulli: I_n(p)=n/{p(1−p)}　／　Var(θ̂)≥1/I_n(θ)']],pitfall:'クラーメル・ラオの下限と最尤推定の漸近正規性には正則条件がある。パラメータで支持が変わる分布は別途確認する。',source:['old','new']},
{id:'ci',group:'確率と推測',title:'区間推定・被覆確率',lead:'区間の幅と、繰り返したときの被覆率を分けて考える。',lab:'intervals',terms:'信頼区間 信頼係数 母平均 母分散 比率 分散比 2標本 被覆',goal:'既知σと未知σを区別して、適切な標本分布と自由度を使う。',example:'正規母集団・σ=10既知・n=100・X̄=50。95%信頼区間は50±1.95996×1=[48.0400,51.9600]。σ未知ならSを用い、t分布の分位点を使う。',sections:[
['平均の区間','正規母集団でσ既知ならz、σ未知ならt(n−1)を用いる。片側95%信頼限界はz0.95、両側95%区間はz0.975。分位点の添字は左側累積確率。','σ既知: X̄±z(1−α/2)σ/√n　／　σ未知: X̄±t(1−α/2,n−1)S/√n'],
['分散・比率・2標本','正規母集団の母分散はχ²分位点で区間を作る。比率のWald区間は境界近くや少数標本で被覆率が崩れ得る。独立2標本の平均差は、等分散を仮定する方法とWelch法を区別する。','σ²の区間: [(n−1)S²/χ²(1−α/2), (n−1)S²/χ²(α/2)]'],
['被覆の解釈','頻度論では母数は固定、データと区間がランダム。95%とは同じ手順を繰り返した場合の被覆率。得られた特定の区間について母数が95%の確率で入る、という事後確率の解釈とは区別する。','Pθ{L(X)≤θ≤U(X)}=1−α'],
['分散比〔2027明記〕','独立な正規2標本では(S1²/σ1²)/(S2²/σ2²)がF(n1−1,n2−1)。標本分散比をFの上側・下側分位点で割ることで、母分散比の信頼区間を得る。','比の区間: [(S1²/S2²)/F(1−α/2), (S1²/S2²)/F(α/2)]']],pitfall:'nを4倍にすると区間の幅はおおむね半分。信頼係数を増やすと、同じデータでは区間は広がる。',source:['old','new','ci','welch']},
{id:'test',group:'確率と推測',title:'仮説検定・検出力',lead:'帰無仮説下の珍しさと、対立仮説下で検出できる確率を区別する。',lab:'power',terms:'p値 第一種 第二種 検出力 NP 尤度比 ワルド スコア 多重比較',goal:'p値・有意水準・検出力を説明し、仮説と棄却域を設計する。',example:'σ=10既知、n=100、H0:μ=50、観測X̄=52。Z=2、両側p値≈0.0455。α=0.05では棄却。これは「H0が正しい確率4.55%」という意味ではない。',sections:[
['検定の設計','まずH0,H1と有意水準を決める。第一種過誤はH0が正しいのに棄却すること。第二種過誤は特定のH1が正しいのに棄却しないこと。検出力1−βはH1の効果量・分散・n・αに依存する。','p値=P(H0の下で、観測以上に極端な統計量)'],
['片側z検定の検出力','H0:μ=μ0、H1:μ>μ0、σ既知。棄却条件はZ>z1−α。真の差δ=μ−μ0なら検出力は1−Φ(z1−α−δ√n/σ)。対立方向は観測前に決める。','Power=1−Φ{z(1−α)−δ√n/σ}'],
['検定法の導出','単純仮説同士では、ネイマン・ピアソンの補題により尤度比で棄却域を決める。一般の尤度比検定は制約付き・なしの最大尤度を比較する。Waldは推定量の距離、スコアはH0での尤度の傾きを使う。','LR=2{ℓ(θ̂)−ℓ(θ̂0)} → χ²(r)（正則条件、H0の下）'],
['多重比較と読み方','m個の検定で家族内第一種過誤率をα以下に抑えるBonferroni法は各α/m。棄却できないことはH0の真偽の確定ではない。統計的有意性と業務上の差の大きさは別に評価する。','Wald=(θ̂−θ0)²/Var̂(θ̂)　／　Score=U(θ0)²/I(θ0)']],pitfall:'検定後に片側へ変更すると、予定した第一種過誤率を保てない。p値と効果量・区間推定を合わせて読む。',source:['old','new','norm']},
{id:'categorical',group:'手法の選択',title:'順位検定・分割表',lead:'データの尺度、対応関係、度数の大きさで方法を選ぶ。',lab:'table',terms:'Wilcoxon 符号付き順位 Kruskal Wallis Spearman χ² オッズ比 Fisher 対数線形 イエーツ',goal:'対応あり・なしと、カテゴリの関連の検定を選び分ける。',example:'2×2表が(40,60;20,80)ならオッズ比=(40×80)/(60×20)=8/3。リスク比は(40/100)/(20/100)=2で、オッズ比とは一致しない。',sections:[
['ノンパラメトリック法','独立2群にはWilcoxon順位和（Mann–Whitney）、対応ある差には符号付き順位、独立3群以上にはKruskal–Wallisを検討。順位和を単純な中央値差の検定と解釈するには分布形などの追加仮定が必要。符号付き順位には差の対称性が必要。','Spearmanのρ=順位へ置換した値のPearson相関'],
['独立性と適合度','独立性では期待度数Eij=行合計×列合計/N、Pearson χ²=Σ(O−E)²/E。r×c表の自由度は(r−1)(c−1)。適合度検定は指定した確率への度数の一致を検討し、推定した母数分の自由度を差し引く。','χ²=Σ (Oij−Eij)²/Eij　／　2×2のOR=ad/(bc)'],
['小標本と残差','期待度数が少ない場合、漸近χ²近似は不適切なことがある。Fisherの正確検定は周辺度数を条件とする超幾何分布を利用。Yates補正は2×2で(|O−E|−0.5)の補正を使う。残差でどのセルが差へ寄与したかを見る。','2×2のφ=(ad−bc)/√{(a+b)(c+d)(a+c)(b+d)}'],
['分割表のモデル','対数線形モデルは期待度数のlogに主効果や交互作用を置く。条件付き独立は、第三のカテゴリを固定した各層で独立が成立すること。グラフィカルモデルは含めた相互作用・条件付き独立の関係を表す。','独立モデル: log m_ij=λ+λᵢᴬ+λⱼᴮ']],pitfall:'オッズ比は確率の比ではない。順位を使っても、独立性や対応関係の仮定が不要になるわけではない。',source:['old','new']},
{id:'regression',group:'手法の選択',title:'線形回帰・回帰診断',lead:'平均構造、誤差構造、外れ値の影響を順に確認する。',lab:'regression',terms:'OLS GLS Gauss Markov R² 調整済 R² 多重共線性 ridge lasso leverage Cook QQ Cp',goal:'最小二乗解と標準誤差の仮定を説明し、残差を読む。',example:'需要を気温で説明するy=β0+β1x+ε。β1は気温1単位変化に対する条件付き平均の変化。時系列の誤差に自己相関があると、通常の独立誤差の標準誤差が不適切になり得る。',sections:[
['最小二乗と条件','Xが列フルランクならβ̂=(XᵀX)⁻¹Xᵀy。E[ε|X]=0で条件付き不偏。Var(ε|X)=σ²IでOLSは線形不偏推定量の中で最小分散（Gauss–Markov）。この定理に誤差の正規性は不要。','Var(β̂|X)=σ²(XᵀX)⁻¹　／　s²=SSE/(n−p)（pは切片を含む係数数）'],
['当てはまりと検定','切片ありのOLSでR²=1−SSE/SST。説明変数を足すと訓練データのR²は低下しない。調整済R²は係数数を補正。係数のt検定や全体F検定を有限標本で正確に行うには正規誤差などの仮定を確認する。','調整済R²=1−{SSE/(n−p)}/{SST/(n−1)}'],
['診断・一般化最小二乗','残差対予測値で非線形や分散の変化、Q–Qで分布を確認。leverageはX空間の離れ方、Cook距離は係数への影響。多重共線性は係数の分散を増やす。既知の誤差共分散ΩにはGLSを用いる。','β̂GLS=(XᵀΩ⁻¹X)⁻¹XᵀΩ⁻¹y'],
['正則化とモデルの複雑さ','ridgeはλΣβj²、lassoはλΣ|βj|を損失へ加える（通常切片を除く）。lassoは係数を0にすることがある。尺度をそろえてλを検証データで選ぶ。Mallows CpはSSE/σ̂²−n+2pという形で、参照分散の推定も必要。改訂範囲表ではridge・Cpも明記されている。','minβ {‖y−Xβ‖²+λ‖β‖²} → ridge']],pitfall:'leverageが大きい点が必ず影響点とは限らない。残差の大きさも合わせて確認する。予測と因果効果は区別する。',source:['old','new']},
{id:'glm',group:'手法の選択',title:'一般化線形モデル・生存時間',lead:'応答の分布に合わせて、平均と線形予測子をリンク関数で結ぶ。',lab:'logistic',terms:'ロジスティック プロビット ポアソン GLM 打ち切り Cox Kaplan Meier ニューラル',goal:'ロジットの係数をオッズ比へ変換し、打ち切りを扱う意味を説明する。',example:'logit p=−2+0.5xなら、xが1増えるとオッズはexp(0.5)≈1.649倍。pそのものが1.649倍になるわけではない。',sections:[
['GLMの3要素','①応答の分布（指数型分布族）、②線形予測子η=Xβ、③リンクg(μ)=η。二値にはBernoulliとlogit、カウントにはPoissonとlogを組み合わせる。','logit(p)=log{p/(1−p)}　／　p=1/(1+exp(−η))'],
['プロビット・ポアソン','probitではp=Φ(η)。Poisson回帰はlog E[Y|x]=Xβで、1単位の変化は平均をexp(βj)倍にする。観測時間が異なるときはlog時間をoffsetとして入れる。分散が平均を超える場合は分布の仮定を再検討する。','Pois: μ=exp(Xβ)　／　log μ=log(観測時間)+Xβ'],
['打ち切りと生存関数','右打ち切りは真のイベント時間が観測終了時刻より後と分かる状態。イベントがない観測を捨てると情報を失う。独立打ち切りなどの仮定の下でKaplan–Meierを利用する。ハザードは、その時点まで生存した条件下での瞬間的発生率。','Ŝ(t)=∏(tⱼ≤t)(1−dⱼ/nⱼ)　／　S(t)=P(T>t)'],
['Coxモデルと非線形モデル','Coxはh(t|x)=h0(t)exp(Xβ)で、ハザード比が時間に依存しない仮定を置く。ニューラルネットは線形結合と非線形活性化の合成で平均構造を表す。係数解釈・汎化評価・過適合への対処を確認する。','HR=exp(βj)（他の変数を固定）']],pitfall:'ハザードは確率そのものではない。打ち切りが予後と関係する場合は、独立打ち切りの仮定を検討する。',source:['old','new']},
{id:'anova',group:'手法の選択',title:'分散分析・実験計画',lead:'群間の差を、群内のばらつきとの比で判断する。',lab:'anova',terms:'一元 二元 交互作用 無作為化 反復 ブロック 乱塊 直交配列 一部実施',goal:'分散分析表の自由度を作り、交互作用と実験の割付を説明する。',example:'3群各8観測なら総自由度23、群間自由度2、群内自由度21。F=MSB/MSWをF(2,21)と比較する。群間差の検定後に無補正で全ペアを検定しない。',sections:[
['一元配置の分解','各群平均と全体平均の差からSSB、各観測と群平均の差からSSWを作る。SST=SSB+SSW。独立・正規・等分散の誤差モデルの下でH0:すべての群平均が等しいをFで検定。','F={SSB/(g−1)}/{SSW/(N−g)}'],
['二元配置と交互作用','y=μ+αA+βB+(αβ)AB+ε。交互作用はAの効果がBの水準によって変わること。交互作用がある場合、平均した主効果だけでは条件別の挙動を説明できない。','交互作用の例: (μ11−μ01)≠(μ10−μ00)'],
['実験の三原則','無作為化：割付をランダムにして交絡を防ぐ。反復：誤差を推定するため独立な実験単位を繰り返す。局所管理（ブロック化）：背景条件をそろえたブロック内で比較。乱塊法は各ブロックへ処理を割り付ける。','観測回数と独立な実験単位の数は区別する'],
['要因計画','全実施は水準の組合せをすべて実施する。一部実施は実験数を減らす代わりに効果の交絡（alias）が生じる。直交配列は列間の均衡を使う設計だが、任意の交互作用が個別に推定できるとは限らない。','計画 → 割付 → 測定 → 分散分解 → 比較']],pitfall:'同じ設備を何度も測った値を、別設備の独立な反復と数えると標準誤差を過小評価する可能性がある。',source:['old','new']},
{id:'sampling',group:'手法の選択',title:'標本調査・有限母集団',lead:'抽出の仕方も推測の一部。母集団と抽出単位を先に定義する。',lab:'sampling',terms:'単純無作為 層化 集落 系統 有限修正 Neyman 配分 抽出確率',goal:'非復元抽出の有限修正と、層化・集落抽出の違いを説明する。',example:'N=1,000設備からn=100を非復元で単純無作為抽出。母集団分散を1/Nで定義してσ=10とすると、SE=10/√100×√(900/999)≈0.9492。',sections:[
['単純無作為抽出と有限修正','N個からn個を非復元抽出。S²を分母N−1の有限母集団分散とするとVar(X̄)=(1−n/N)S²/n。σ²を分母Nで定義すれば(N−n)/(N−1)×σ²/n。この教材の操作画面は後者を使う。','SE=σ/√n × √{(N−n)/(N−1)}'],
['層化抽出','母集団を重複しない層に分け、各層から抽出。層の重みWh=Nh/Nで推定平均を足す。費用が同じときNeyman配分はnh∝NhSh。層内分散を小さくするように層を作ると分散削減が期待できる。','X̄st=Σ Wh X̄h　／　Var=Σ Wh²(1−nh/Nh)Sh²/nh'],
['集落・系統・重み','集落抽出は設備を拠点などのまとまりで選ぶ。集落内の相関があると同じnの単純無作為抽出より分散が増え得る。系統抽出はランダムな起点から一定間隔で選ぶ。周期性に注意。抽出確率が異なるなら重みで補正する。','Horvitz–Thompsonの総計推定: T̂=Σ(抽出単位) yi/πi']],pitfall:'便利に集めた標本を単純無作為抽出として扱わない。標本数を増やすだけでは選択バイアスを解消できない。',source:['old','new']},
{id:'multivariate',group:'手法の選択',title:'多変量解析・次元削減',lead:'圧縮、分類、群分け、潜在構造のどれが目的かを決める。',lab:'pca',terms:'PCA 因子 回転 LDA QDA SVM ROC AUC 混同行列 kmeans 階層 MDS 正準相関 対応 数量化 SEM',goal:'主成分の固有値・寄与率と、各多変量手法の目的を区別する。',example:'標準化2変数の相関行列が[[1,0.8],[0.8,1]]なら固有値は1.8と0.2。第1主成分の寄与率90%、方向は(1,1)/√2。',sections:[
['主成分分析','共分散（または相関）行列の固有ベクトル方向へ射影する。第1主成分は長さ1の係数で分散を最大化し、後続は直交制約の下で最大化。スコアは各観測の主成分座標。負荷量の定義は固有ベクトル係数か元変数との相関か、教材の規約を確認する。','Σvj=λjvj　／　寄与率j=λj/Σλk'],
['分類と評価','LDAは群ごとの正規分布と共通共分散、QDAは群別共分散を用いる。SVMはマージンを使う分類。ROCは閾値別の偽陽性率と真陽性率。AUCはランダムな陽性のスコアが陰性を上回る確率（同点は1/2）として読める。','TPR=TP/(TP+FN)　／　FPR=FP/(FP+TN)'],
['群分けと距離','k-meansは群内平方距離和を最小化し、初期値で局所解が変わる。階層クラスタは距離と結合法で木を作る。距離は尺度に影響される。MDSは距離関係を低次元座標へ表す。','k-means: Σclusters Σpoints ‖xi−μcluster‖²'],
['因子・構造方程式','因子分析は共通因子と独自成分で観測共分散を表す。共通性は共通因子の説明分散。回転で解釈を変え、斜交回転では因子間相関を許す。SEMは測定モデルと変数間の構造を併せるが、当てはまりだけで因果方向を証明できない。','x=Λf+ε　／　Σ=ΛΦΛᵀ+Ψ'],
['その他の方法','正準相関は2組の変数の線形結合間の相関を最大化。対応分析は分割表の行・列を低次元へ配置。数量化法はカテゴリ変数へ数値を与える方法群。正準判別は群間分散と群内分散の比を用いる。操作変数は内生変数に対する外生な変動を利用し、関連性と排除制約を要する。','目的とデータ型で選び、説明・分類・因果を区別する']],pitfall:'単位の大きい変数が共分散PCAを支配することがある。標準化は自動的に正解ではなく、単位と目的で決める。',source:['old','new','pca']},
{id:'markov',group:'依存・計算',title:'マルコフ連鎖・確率過程',lead:'次の状態を、現在の状態に条件付けた確率で記述する。',lab:'markov',terms:'推移確率 定常分布 既約 再帰 周期 ランダムウォーク ポアソン過程 ブラウン',goal:'確率ベクトルの更新と定常分布を計算し、収束条件を説明する。',example:'正常→故障がa=0.1、故障→正常がb=0.3なら、定常故障確率a/(a+b)=0.25。定常分布と、そこへ収束するための条件は分けて確認する。',sections:[
['推移と定常分布','この教材は行確率ベクトルpを用いp(t+1)=p(t)P。各行の和は1。定常分布πはπP=π、Σπi=1を解く。2状態ならπ=(b/(a+b),a/(a+b))（a+b>0）。','P=[[1−a,a],[b,1−b]]　／　πP=π'],
['既約・再帰・周期','既約は任意の状態間に到達経路があること。再帰はその状態へ再び戻る確率が1。有限既約連鎖には一意な定常分布があるが、各初期分布からそこへ収束するには非周期性も必要。','有限＋既約＋非周期 ⇒ 初期分布によらず定常分布へ収束'],
['基礎的確率過程','ランダムウォークは増分を足す離散時間過程。Poisson過程は独立で定常な増分をもち、時間tの発生数はPoisson(λt)。標準ブラウン運動の増分B(t)−B(s)はN(0,t−s)、独立増分と連続標本路をもつ。','N(t)∼Pois(λt)　／　Var[B(t)−B(s)]=t−s']],pitfall:'a=b=1の連鎖は交互に移り周期2。定常分布は存在するが、任意の初期状態から分布が収束するとは限らない。',source:['old','new']},
{id:'timeseries',group:'依存・計算',title:'時系列・ARIMA',lead:'時間順序を保ち、平均・分散・自己共分散の時間依存を確認する。',lab:'ar',terms:'定常 ACF PACF AR MA ARIMA 階差 DW ペリオドグラム スペクトル 状態空間',goal:'AR(1)の定常条件と自己相関を計算し、時系列の検証方法を選ぶ。',example:'Xt=0.8Xt−1+εt、Var(ε)=1なら定常分散1/(1−0.8²)=2.7778、ラグ2の自己相関は0.8²=0.64。φ=1ならランダムウォークで分散が時間とともに増える。',sections:[
['定常性とAR(1)','ここでは共分散定常性を扱う：平均一定、有限分散一定、共分散はラグだけに依存。平均0のAR(1)は|φ|<1で定常解をもち、ACFはφᵏ。φ=1は単位根。','Xt=φXt−1+εt　／　Var(X)=σε²/(1−φ²)　／　ρk=φᵏ'],
['AR・MA・差分','AR(p)は過去の値、MA(q)は過去の誤差を使う。純粋AR(p)のPACFはpで打ち切り、純粋MA(q)のACFはqで打ち切り（理論値）。ARIMA(p,d,q)はd階差分した系列をARMAで記述する。','ΔXt=Xt−Xt−1　／　(1−B)ᵈXtをARMA(p,q)でモデル化'],
['診断とスペクトル','標本ACF/PACFは有限標本の推定で、厳密な打ち切りにはならない。DWは残差の一階差分平方和と残差平方和の比で、約2(1−r1)。スペクトルは共分散を周波数へ表したもので、ペリオドグラムは標本からの周波数別変動の指標。','DW=Σ(et−et−1)²/Σet²'],
['状態空間と予測検証','状態方程式で潜在状態の推移、観測方程式で測定をモデル化する。線形GaussianならKalman filterを用いる。需要予測の評価は未来を訓練へ混ぜず、時点を進める検証を使う。','状態: xt=Fxt−1+wt　／　観測: yt=Hxt+vt']],pitfall:'ランダムな分割が未来情報の漏洩を生む場合がある。説明変数も予測時点で入手できる値かを確認する。',source:['old','new','ar']},
{id:'selection',group:'依存・計算',title:'モデル選択・汎化評価',lead:'訓練データへの適合と、未観測データでの誤差を区別する。',lab:'selection',terms:'AIC BIC cross validation 過適合 バイアス バリアンス',goal:'同じデータに対する情報量規準を計算し、適切な検証分割を選ぶ。',example:'n=100、モデルAはℓ=−80,k=3、Bはℓ=−76,k=6。AICは166と164でB、BICは約173.816と179.631でA。目的とペナルティが違うため結論は一致しないことがある。',sections:[
['情報量規準','AIC=−2ℓ+2k、BIC=−2ℓ+k log n。kは尤度に含まれる推定パラメータ数で、回帰なら分散パラメータも数える規約を統一。小さい方を選ぶ。同じ応答・同じ観測データ・比較可能な尤度で比較する。','AIC=−2ℓ+2k　／　BIC=−2ℓ+k log n'],
['交差検証','K分割で、各検証部分を除いて学習し誤差を集計。変数選択、標準化、補完、ハイパーパラメータ選択を学習部分の中で行う。選択に使ったCV値で最終性能を評価すると楽観的になるため、別テストやnested CVを検討する。','学習 → 選択 → 最終評価を、情報が混ざらないように配置する'],
['バイアス・バリアンス','複雑さを増やすと表現可能な関数が増える一方、標本による推定の変動も変わる。予測MSEには既約なノイズも含まれる。時系列・同一設備の反復は、時間・設備単位の分割を使う。','予測MSE=バイアス²+推定の分散+不可避なノイズ（平方損失の分解）']],pitfall:'AIC/BICの値そのものに合格閾値はない。訓練R²の最大化だけでは予測性能を保証しない。',source:['old','new']},
{id:'missing',group:'依存・計算',title:'欠測・不完全データ',lead:'欠測した理由が、観測された値や未観測の値とどう関係するかを考える。',lab:'missing',terms:'MCAR MAR MNAR EM 削除 補完 代入 多重代入',goal:'欠測メカニズムと、削除・補完の仮定を区別する。',example:'設備の測定値が高いほどセンサの上限で欠測し、その値自体が観測されないならMNARが疑われる。観測値の平均だけを使うと、全体平均からずれる可能性がある。',sections:[
['MCAR・MAR・MNAR','MCAR：欠測が観測値・未観測値に依存しない。MAR：観測値を条件にすると欠測が未観測値に依存しない。MNAR：その条件付け後も未観測値に依存する。MARは「無条件にランダム」という意味ではない。','MAR: P(R|Yobs,Ymis)=P(R|Yobs)'],
['削除と代入','完全ケースの単純な平均はMCARなら不偏性を期待できるが、より一般の削除の妥当性は推定対象とモデルによる。単一平均代入は分散を過小にすることがある。多重代入は代入間の不確実性も統合する。','Rは観測の有無を表す指標として定義する'],
['EMアルゴリズム','Eステップで現在のパラメータを用いた完全データ対数尤度の条件付き期待値Qを計算。MステップでQを最大化する。観測データ尤度を非減少にするが、大域的最大解への到達を保証しない。','Q(θ|θold)=E[log f(Yobs,Ymis;θ)|Yobs,θold]']],pitfall:'観測データだけでMARとMNARを一般に識別できるとは限らない。欠測理由の調査と感度分析が必要。',source:['old','new']},
{id:'bayesian',group:'依存・計算',title:'ベイズ推定・再標本化',lead:'事前と尤度を統合し、解析できない場合は計算で近似する。',lab:'posterior',terms:'事前 事後 共役 階層 Bayes MH Gibbs MCMC bootstrap jackknife モンテカルロ 棄却法',goal:'共役事後分布を求め、再標本化とMCMCの違いを説明する。',example:'p∼Beta(2,3)、成功7・失敗13なら事後はBeta(9,16)。事後平均は9/25=0.36。MLE0.35と異なるのは、事前情報を含むため。',sections:[
['事前・事後','事後密度は尤度×事前密度を正規化して得る。Beta(a,b)とBernoulli/Binomialは共役。ベイズの信用区間は与えたモデルと事前の下での事後確率の区間。階層モデルは群のパラメータを共通の分布で結ぶ。','p|data∼Beta(a+s,b+n−s)　／　事後平均=(a+s)/(a+b+n)'],
['モンテカルロと棄却法','独立な乱数で期待値を標本平均として近似すると、有限分散なら誤差は概ねB⁻¹ᐟ²。棄却法は目標密度fを包むMgから候補を出し、f(x)/(Mg(x))で採択。分散削減や乱数の生成法も結果へ影響する。','MCの標準誤差≈標本標準偏差/√B'],
['MCMC','MHは候補y∼q(y|x)を、min{1,π(y)q(x|y)/(π(x)q(y|x))}で採択。Gibbsは完全条件付き分布から順に生成する。相関するサンプルなので有効標本サイズを確認する。定常分布を持つことと実際の収束確認は別。','対称提案ならMH採択確率=min{1,π(y)/π(x)}'],
['ブートストラップ・ジャックナイフ','非パラメトリックbootstrapは元のn観測から復元抽出して推定を繰り返す。jackknifeは1観測ずつ除いた推定値を使う。独立標本を想定したbootstrapを時系列へそのまま適用せず、ブロック法などを検討する。','jackknifeバイアス推定=(n−1)(θ̄(−i)−θ̂)']],pitfall:'再標本化は観測の選択バイアスを自動修正しない。MCMCの反復数を増やすだけで収束問題が解決するとは限らない。',source:['old','new','beta'],extraLab:'bootstrap'},
{id:'causal',group:'2027年からの追加',title:'統計的因果推論',lead:'介入した結果を知るために、観測された関連から交絡を除く条件を確認する。',lab:'causal',terms:'DAG d分離 バックドア フロントドア 直接 間接 効果 構造方程式',scope:'new',goal:'DAGの経路を読み、調整してよい変数と調整すべきでない変数を区別する。',example:'省エネ施策Aが主に大規模設備Cへ導入されると、大規模設備は元から需要Yが多いため、施策群の平均需要が大きく見える。規模Cで層別して共通の構成比にそろえると施策の平均差を評価できる。',sections:[
['因果効果と識別','潜在結果Y(1),Y(0)の差の平均E[Y(1)−Y(0)]が平均処置効果。観測平均との差E[Y|A=1]−E[Y|A=0]と一般には一致しない。条件付き交換可能性・positivity・consistencyなどの仮定の下で調整による識別を行う。','ATE=E[Y(1)−Y(0)]'],
['DAGと有向分離','DAGは有向・非巡回のグラフ。鎖A→C→Yや分岐A←C→YはCへの条件付けで遮断。合流A→C←Yは元は遮断され、Cやその子孫への条件付けで開く。有向分離（d-separation）はこれを経路全体へ一般化する。','交絡: A←C→Y　／　媒介: A→M→Y　／　合流: A→K←Y'],
['バックドアと調整','調整集合はAの子孫を含めず、Aへ矢印が入る経路を遮断する。基準を満たすCなら、介入分布はΣc P(Y|A=a,C=c)P(C=c)で識別。媒介を調整すると総効果の経路を遮断する。','E[Y|do(A=a)]=Σc E[Y|A=a,C=c]P(C=c)'],
['フロントドア・直接・間接','フロントドアはA→M→Yの全有向経路をMが遮り、AとMのバックドアがなく、MとYのバックドアをAが遮る等の条件で媒介から効果を識別する。直接・間接効果の定義と識別には追加の仮定がある。線形で交互作用がない構造モデルでは経路係数の積で間接効果を表せる。','総効果=直接経路＋間接経路（加法的な線形モデルの場合）']],pitfall:'予測に有用な変数でも因果効果の調整へ入れるべきとは限らない。未測定交絡が残れば、図の当てはまりだけで因果効果は特定できない。',source:['new','causal']}
];

const Q=[];
function mc(m,t,o,a,e,h){Q.push({id:'q'+(Q.length+1),m,t,o,a,e,h,type:'mc'});}
function num(m,t,a,tol,e,h){Q.push({id:'q'+(Q.length+1),m,t,a,tol,e,h,type:'num'});}
mc('prob','P(A)=0.4、P(B)=0.5、P(A∩B)=0.2。P(A|B)はいくつか。',['0.1','0.2','0.4','0.5','0.9'],2,'P(A|B)=0.2/0.5=0.4。条件Bの確率を分母にする。','条件を表す事象の確率で割る。');
mc('prob','P(A)>0、P(B)>0でAとBが排反のとき、必ず成り立つものはどれか。',['AとBは独立','P(A∩B)=P(A)P(B)','P(A|B)=P(A)','P(A∩B)=0','P(A∪B)=1'],3,'排反は同時に起きないので交差確率0。P(A)P(B)>0だから独立にはならない。和が1である必要はない。','排反の定義を確認する。');
num('prob','故障率1%、検出率90%、正常時の誤警報率5%。警報時の故障確率を百分率で入力（小数第2位まで）。',15.38,0.0051,'0.01×0.9 / (0.01×0.9+0.99×0.05)=0.153846…、百分率で15.38%。','故障で警報と、正常で警報の2経路を足す。');

<script>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=3)=>Number.isFinite(x)?Number(x).toLocaleString('ja-JP',{maximumFractionDigits:d,minimumFractionDigits:d}):'定義されない';
const pct=x=>fmt(100*x,2)+'%';
const C={green:'#17665d',orange:'#ba5b27',blue:'#416aa0',red:'#b33842',line:'#d9e2de',muted:'#546969'};

try{const st=JSON.parse(localStorage.getItem(KEY)||'null');if(st&&st.answers&&st.learned){state={...state,...st};}}catch(e){storeAvailable=false;}

function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>$('#toast').hidden=true,3500);}
const eligibleM=()=>M.filter(m=>m.scope!=='new'||state.scope==='2027');

const wrong=()=>eligibleQ().filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);

function getM(id){return M.find(m=>m.id===id);}
function rng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function normal(r){return Math.sqrt(-2*Math.log(Math.max(r(),1e-12)))*Math.cos(2*Math.PI*r());}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const variance=a=>a.length<2?0:a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1);
function ncdf(z){if(z===0)return .5;return .5+.5*Math.sign(z)*gammaP(.5,z*z/2);}
function nq(p){let l=-10,h=10;for(let i=0;i<70;i++){let m=(l+h)/2;if(ncdf(m)<p)l=m;else h=m;}return(l+h)/2;}
function logGamma(z){const c=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);z--;let x=.99999999999980993;for(let i=0;i<c.length;i++)x+=c[i]/(z+i+1);const t=z+7.5;return .9189385332046727+(z+.5)*Math.log(t)-t+Math.log(x);}
function betaCF(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;d=1/Math.max(Math.abs(d),1e-30)*Math.sign(d||1);let h=d;for(let m=1;m<=250;m++){let aa=m*(b-m)*x/((qam+2*m)*(a+2*m));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+2*m)*(qap+2*m));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const delta=d*c;h*=delta;if(Math.abs(delta-1)<1e-12)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log1p(-x));return x<(a+1)/(a+b+2)?bt*betaCF(a,b,x)/a:1-bt*betaCF(b,a,1-x)/b;}
function gammaP(a,x){if(x<=0)return 0;const lg=logGamma(a),factor=Math.exp(-x+a*Math.log(x)-lg);if(x<a+1){let sum=1/a,del=sum,ap=a;for(let n=1;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-13)break;}return Math.min(1,sum*factor);}let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<500;i++){let an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-13)break;}return Math.max(0,1-factor*h);}
const fpvalue=(f,d1,d2)=>1-ibeta(d1*f/(d1*f+d2),d1/2,d2/2);
const chiP=(x,df)=>1-gammaP(df/2,x/2);
const betaPdf=(x,a,b)=>Math.exp((a-1)*Math.log(x)+(b-1)*Math.log1p(-x)-logGamma(a)-logGamma(b)+logGamma(a+b));
function quantile(a,p){const b=[...a].sort((x,y)=>x-y),i=(b.length-1)*p,l=Math.floor(i);return b[l]+(b[Math.min(l+1,b.length-1)]-b[l])*(i-l);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function ols(pts){const n=pts.length,xm=mean(pts.map(p=>p.x)),ym=mean(pts.map(p=>p.y));let sxx=0,sxy=0;for(const p of pts){sxx+=(p.x-xm)**2;sxy+=(p.x-xm)*(p.y-ym);}const slope=sxy/sxx,intercept=ym-slope*xm,sse=pts.reduce((s,p)=>s+(p.y-intercept-slope*p.x)**2,0),sst=pts.reduce((s,p)=>s+(p.y-ym)**2,0);return{n,slope,intercept,sse,r2:1-sse/sst,s2:sse/(n-2)};}

function updateNav(){const a=answered();$('#side-count').textContent=a.length+' / '+eligibleQ().length;$('#side-progress').style.width=(a.length/eligibleQ().length*100)+'%';const query=$('#search').value.trim().toLowerCase();let h='<button data-go="home"><span class="num">⌂</span>学習ホーム</button><button data-go="practice"><span class="num">✎</span>演習室・誤答復習</button><button data-go="coverage"><span class="num">≡</span>範囲対応表・学習記録</button>';let group='';eligibleM().forEach((m)=>{if(query&&!(m.title+' '+m.terms).toLowerCase().includes(query))return;if(m.group!==group){group=m.group;h+='<div class="nav-group">'+escape(group)+'</div>';}h+='<button data-go="'+m.id+'"><span class="num">'+String(M.indexOf(m)+1).padStart(2,'0')+'</span>'+escape(m.title)+'<span class="dot">'+(state.learned[m.id]?'✓':'')+'</span></button>';});h+='<div class="nav-group">資料</div><button data-go="sources"><span class="num">↗</span>出典・定義・利用方法</button>';$('#nav').innerHTML=h;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===route.page));}
let route={page:'home',tab:'lesson'};
function readRoute(){const p=location.hash.replace('#','').split('/');return{page:p[0]||'home',tab:p[1]||'lesson'};}
function go(page,tab){const target='#'+page+(tab?'/'+tab:'');if(location.hash===target)render();else location.hash=target;closeMenu();}
function closeMenu(){$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}
function render(){clearInterval(clockId);route=readRoute();if(getM(route.page)?.scope==='new'&&state.scope==='2026'){go('coverage');return;}$('#scope').value=state.scope;updateNav();const m=getM(route.page);$('#crumb').textContent=m?m.group+' / '+m.title:({home:'学習ホーム',practice:'演習室',coverage:'範囲対応表・学習記録',sources:'出典・定義・利用方法'}[route.page]||'学習ホーム');const root=$('#content');if(m){state.last=m.id;save();root.innerHTML=chapter(m);if(route.tab==='lab'){LABS[m.lab]($('#lab-main'));if(m.extraLab)LABS[m.extraLab]($('#lab-extra'));}if(route.tab==='quiz')bindQuestions(root);}else if(route.page==='practice')renderPractice();else if(route.page==='coverage')root.innerHTML=coverage();else if(route.page==='sources')root.innerHTML=sources();else root.innerHTML=home();window.scrollTo(0,0);}
function home(){const n=eligibleM().length;return `<div class="hero"><div><div class="eyebrow">Statistics / interactive notebook</div><h1>数式を、<br>動かして理解する。</h1><p>統計検定準1級の主要分野を、解説・実験・演習でつなぐ学習ノート。条件を変え、結果を読み、手法を選ぶ理由まで確かめる。</p><button class="btn" data-go="${state.last&&eligibleM().some(m=>m.id===state.last)?state.last:'prob'}">${state.last==='prob'?'学習を始める':'前回の章から続ける'} →</button></div><svg class="hero-svg" viewBox="0 0 420 240" role="img" aria-label="母分布と標本平均の分布をイメージした曲線"><path d="M25 208H402" stroke="#b8dec966"/><path d="M28 205C66 202 80 156 126 109S227 143 261 182S338 205 395 207" fill="none" stroke="#bfe8d0" stroke-width="3"/><path d="M30 208C138 208 149 207 169 188S195 73 215 53S244 130 268 187S313 207 392 208" fill="none" stroke="#e8aa78" stroke-width="3"/><line x1="215" y1="37" x2="215" y2="209" stroke="#ffffff44" stroke-dasharray="4 5"/><text x="215" y="24" fill="#e3f2ea" font-size="13" text-anchor="middle">μ</text><text x="70" y="88" fill="#bfe8d0" font-size="12">元の分布</text><text x="274" y="68" fill="#f4d4b8" font-size="12">標本平均</text><text x="26" y="233" fill="#c1e8d2" font-size="11">図は概念図・縮尺は模式的</text></svg></div>
<div class="stats-row"><div class="stat"><strong>${n}</strong><span>学習分野</span></div><div class="stat"><strong>${eligibleQ().length}</strong><span>独自作成の確認問題</span></div><div class="stat"><strong>${answered().length}</strong><span>解答済みの問題</span></div></div>
<div class="panel" style="margin-bottom:25px"><h3>1章の進め方</h3><div class="flow"><span>① 目的と仮定を読む</span><b>→</b><span>② パラメータを動かす</span><b>→</b><span>③ 3問を解く</span><b>→</b><span>④ 誤答を説明し直す</span></div><p class="small muted">まず確率・推測を順番に学び、次に手法の選択へ進みます。既知の分野は確認問題から着手できます。目次の検索で用語から章へ移動できます。</p></div>
<div class="callout orange"><strong>${state.scope==='2026'?'現行範囲を表示中':'2027年改訂範囲を表示中'}</strong><p>${state.scope==='2026'?'2027年1月1日から追加される因果推論は、左上の範囲切替で表示できます。':'因果推論の章と、既存分野の用語の整理に対応した補足も読めます。'} 公式の範囲・試験概要は2026年10月11日に確認。教材の学習構成・例題・生成データは独自作成です。</p></div>
<div class="section" style="margin-top:28px"><h2>学習マップ</h2><p class="small muted" style="margin:7px 0 16px">主要な考え方を解説。周辺手法は要点を比較し、詳細は公式教材へつなぎます。</p><div class="cards">${eligibleM().map((m,i)=>`<button class="course-card" data-go="${m.id}"><span class="index">${String(i+1).padStart(2,'0')}</span><h3>${m.title}</h3><p>${m.lead}</p><span class="small muted">${state.learned[m.id]?'✓ 理解確認済み':'解説・実験・3問'}${m.scope==='new'?' / 2027追加':''}</span></button>`).join('')}</div></div>
<div class="panel" style="margin-top:25px"><h3>独自演習の使い方</h3><p class="small muted">章別演習と10問練習は即時解説付き。25問の時間制限演習は90分で、提出後に解説を表示します。各問を等配点で集計するため、公式試験の得点や合格見込みには換算しません。</p><div style="margin-top:15px"><button class="btn primary" data-go="practice">演習室を開く</button></div></div>`;}
function chapter(m){const i=M.indexOf(m)+1;const sections=m.sections.filter(s=>s[3]!=='new'||state.scope==='2027');return `<div class="page-head"><div class="eyebrow">Chapter ${String(i).padStart(2,'0')} / ${m.group}</div><h1>${m.title}</h1><p>${m.lead}</p><div class="tags"><span class="tag">${m.scope==='new'?'2027年からの追加':'現行・改訂に共通'}</span><span class="tag">確認問題 3問</span></div></div><div class="callout"><strong>到達目標</strong><p>${m.goal}</p></div><div class="tabs" role="tablist">${[['lesson','理解する'],['lab','動かす'],['quiz','確かめる']].map(([t,n])=>`<button class="tab ${route.tab===t?'active':''}" role="tab" aria-selected="${route.tab===t}" data-go="${m.id}" data-tab="${t}">${n}</button>`).join('')}</div><div class="chapter-body">${route.tab==='lab'?`<div id="lab-main" class="panel"></div>${m.extraLab?'<div id="lab-extra" class="panel"></div>':''}`:route.tab==='quiz'?`<p class="small muted">5肢選択・数値入力の独自問題です。数値は指定の単位・丸めで入力してください。最初の解答と最新の解答を別に記録します。</p>${Q.filter(q=>q.m===m.id).map(questionHTML).join('')}`:`${sections.map((s,j)=>`<details class="lesson-section" ${j<2?'open':''}><summary>${s[0]}</summary><div class="detail"><p>${s[1]}</p><div class="formula">${escape(s[2])}</div></div></details>`).join('')}<div class="lesson-example"><h3>数値で確かめる</h3><p>${m.example}</p></div><div class="callout orange" style="margin-top:19px"><strong>解釈で確認すること</strong><p>${m.pitfall}</p></div><div style="margin-top:20px"><button class="btn primary" data-go="${m.id}" data-tab="lab">パラメータを動かす →</button></div>`}<div class="lesson-footer"><label class="small"><input type="checkbox" data-learned="${m.id}" ${state.learned[m.id]?'checked':''}> 仮定と結論を自分で説明できた</label><button class="btn" data-go="${eligibleM()[Math.min(eligibleM().indexOf(m)+1,eligibleM().length-1)].id}">次の章 →</button></div><p class="chapter-source">範囲・参考：${m.source.map(id=>`<a href="${SOURCES.find(s=>s.id===id).url}" target="_blank" rel="noopener">${id==='old'?'現行範囲':id==='new'?'改訂範囲':SOURCES.find(s=>s.id===id).name.split('｜')[0]}</a>`).join('')}<a href="#sources">引用と補足</a></p></div>`;}
function questionHTML(q){const a=state.answers[q.id];return `<div class="q-card" data-question="${q.id}"><div class="q-number"><span>${q.id.toUpperCase()} / ${q.type==='mc'?'5肢選択':'数値入力'}</span><span>${a?(a.correct?'最新：正答':'最新：要復習'):'未解答'}</span></div><div class="q-prompt">${q.t}</div>${q.type==='mc'?`<div class="q-options">${q.o.map((o,i)=>`<label class="q-option"><input type="radio" name="${q.id}" value="${i}"><span>${String.fromCharCode(65+i)}. ${escape(o)}</span></label>`).join('')}</div>`:`<div class="q-answer"><label class="sr-only" for="answer-${q.id}">数値解答</label><input type="number" id="answer-${q.id}" step="any" placeholder="数値を入力"></div>`}<div class="q-action"><button class="btn primary" data-check="${q.id}">解答を確認</button><button class="btn" data-hint="${q.id}" aria-expanded="false">ヒント</button></div><div class="q-hint" hidden>${q.h}</div><div class="feedback" role="status" hidden></div></div>`;}
function validateAnswer(q,v){return q.type==='mc'?Number(v)===q.a:Number.isFinite(Number(v))&&Math.abs(Number(v)-q.a)<=q.tol;}
function record(q,value){const old=state.answers[q.id];state.answers[q.id]={value,correct:validateAnswer(q,value),firstCorrect:old?old.firstCorrect:validateAnswer(q,value),tries:(old?.tries||0)+1,at:new Date().toISOString()};save();updateNav();}
function bindQuestions(root){$$('[data-check]',root).forEach(btn=>btn.addEventListener('click',()=>{const q=Q.find(q=>q.id===btn.dataset.check),box=btn.closest('.q-card');const v=q.type==='mc'?$('input:checked',box)?.value:$('input[type=number]',box).value;if(v===undefined||v===''){notify('解答を選択、または数値を入力してください。');return;}const ok=validateAnswer(q,v);record(q,v);const f=$('.feedback',box);f.hidden=false;f.className='feedback'+(ok?'':' bad');f.innerHTML=`<strong>${ok?'正答':'要復習'}</strong>${q.e}<div class="correct-answer">答え：${q.type==='mc'?String.fromCharCode(65+q.a)+'. '+escape(q.o[q.a]):q.a}</div>`;if(q.type==='mc')$$('.q-option',box).forEach((label,i)=>{label.classList.toggle('correct',i===q.a);label.classList.toggle('wrong',i===Number(v)&&!ok);});$('.q-number span:last-child',box).textContent=ok?'最新：正答':'最新：要復習';}));$$('[data-hint]',root).forEach(btn=>btn.addEventListener('click',()=>{const h=$('.q-hint',btn.closest('.q-card'));h.hidden=!h.hidden;btn.setAttribute('aria-expanded',String(!h.hidden));}));}
function coverage(){const answeredQ=answered(),first=answeredQ.filter(q=>state.answers[q.id].firstCorrect).length;return `<div class="page-head"><div class="eyebrow">Syllabus & progress</div><h1>範囲対応表・学習記録</h1><p>公式範囲の主要項目を教材の章へ対応させました。各章の概要を押さえ、公式ワークブックの例題・問題集で計算と導出を補います。</p></div><div class="stats-row"><div class="stat"><strong>${answeredQ.length}/${eligibleQ().length}</strong><span>解答済み</span></div><div class="stat"><strong>${answeredQ.length?pct(first/answeredQ.length):'—'}</strong><span>初回正答率（解答済みのみ）</span></div><div class="stat"><strong>${wrong().length}</strong><span>最新解答が誤答の問題</span></div></div><div class="panel"><h3>対応する範囲と扱う深さ</h3><div class="table-wrap"><table><thead><tr><th>教材の章</th><th>用語・範囲</th><th>教材内の扱い</th><th>確認</th></tr></thead><tbody>${eligibleM().map(m=>`<tr><td><a href="#${m.id}">${m.title}</a></td><td>${m.terms}</td><td>${m.id==='multivariate'?'PCAは操作・計算。他の方法は目的・仮定の要点':m.id==='glm'?'logitは操作。生存時間・非線形は要点':m.id==='bayesian'?'共役更新・bootstrapは操作。MCMCは手順の要点':'主要概念の解説・操作・3問'}${m.scope==='new'?'（2027追加）':''}</td><td>${state.learned[m.id]?'✓':'—'}</td></tr>`).join('')}</tbody></table></div><div class="callout orange"><strong>補う学習</strong><p>非心分布、各検定法の完全な導出、正準判別・数量化法・構造方程式の詳細、要因計画のalias、MCMCの収束診断などは概要にとどまります。公式範囲表と対応する公式教材で例題を解き、適用条件・計算を確認してください。</p></div></div><div class="panel"><h3>学習記録の保存</h3><p class="small muted">同じブラウザで開くと、解答・理解チェック・受験範囲が保存されます。別端末へ移す場合はJSONを出力して読み込めます。プライベートモードやファイルURLで保存が制限される環境では出力を使ってください。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" id="export">記録を出力</button><label class="btn">記録を読み込む<input type="file" id="import" accept="application/json,.json" hidden></label><button class="btn danger" id="reset">記録を初期化</button></div><p class="storage-note">${storeAvailable?'この環境ではブラウザへの保存が利用できます。':'この環境ではブラウザ保存を利用できません。記録の出力を使ってください。'}</p></div>`;}
function sources(){return `<div class="page-head"><div class="eyebrow">References / checked 2026-10-11</div><h1>出典・定義・利用方法</h1><p>公式の範囲と一次教材を参照し、解説・数値例・問題・図は独自に作成しました。以下は検証に使った短い引用と、その使い方です。</p></div><div class="panel"><h3>教材の前提</h3><p class="small">外部ライブラリ・画像・フォントを読み込まない単体HTMLです。インターネット接続がなくても解説・操作・演習を使えます。出典リンクは接続時に開いてください。</p><p class="small">表記：N(μ,σ²)の第2引数は分散、Gamma(a,b)のbは率、幾何は初成功までの試行数、負の二項はr回成功までの失敗数、logは自然対数。分位点zpはP(Z≤zp)=pの値。回帰のpは切片を含む係数数です。</p><p class="small">数値：CDF・分位点・p値は近似計算。乱数実験は有限回なので理論値と一致しません。表示される電力需要・設備故障の例は学習用の仮想データです。</p><p class="small">演習：5肢選択・数値入力で独自作成。公式過去問を転載していません。時間制限演習は25問・90分、教材内では各問等配点で正答率を表示します。</p></div><div class="panel"><h2>引用と参考資料</h2>${SOURCES.map(s=>`<article class="source-card"><h3>${s.name}</h3><div class="small muted">original_text</div><blockquote>${escape(s.quote)}</blockquote><div><b>source</b> — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a></div><p class="small muted">引用位置：${s.location}</p><p style="margin-top:8px"><b>note</b> — ${s.note}</p></article>`).join('')}</div>`;}

let practiceList=null,examIndex=0,clockId=null;
function renderPractice(){clearInterval(clockId);const root=$('#content');if(state.exam&& !state.exam.finished){renderExam();return;}root.innerHTML=`<div class="page-head"><div class="eyebrow">Practice room</div><h1>演習室</h1><p>解答を思い出せるかに加えて、どの仮定を使ったかを言葉にして確認します。</p></div><div class="grid"><div class="panel"><h3>10問練習</h3><p class="small muted">表示中の範囲からランダムに10問。解答ごとにヒント・解説を確認できます。</p><button class="btn primary" id="practice-random" style="margin-top:15px">10問を選ぶ</button></div><div class="panel"><h3>誤答を復習</h3><p class="small muted">最新の解答が誤答の${wrong().length}問を表示。正答するまで復習対象として残ります。</p><button class="btn" id="practice-wrong" style="margin-top:15px" ${wrong().length?'':'disabled'}>誤答を解き直す</button></div><div class="panel"><h3>時間制限演習</h3><p class="small muted">独自問題25問・90分。選択と数値入力を保存し、提出後に解説を表示します。全問等配点の教材内正答率で集計します。</p><button class="btn primary" id="exam-start" style="margin-top:15px">25問・90分で開始</button></div><div class="panel"><h3>学習状況</h3><div class="metrics"><span>解答済み<strong>${answered().length}/${eligibleQ().length}</strong></span><span>最新の正答率<strong>${answered().length?pct(correct().length/answered().length):'—'}</strong></span></div><button class="btn" data-go="coverage">章別の記録を見る</button></div></div><div id="practice-questions" style="margin-top:25px"></div>`;
$('#practice-random').onclick=()=>showPractice(shuffle(eligibleQ()).slice(0,10),'10問練習');$('#practice-wrong').onclick=()=>showPractice(wrong(),'誤答の復習');$('#exam-start').onclick=()=>{state.exam={ids:shuffle(eligibleQ()).slice(0,25).map(q=>q.id),responses:{},flags:{},end:Date.now()+90*60000,scope:state.scope,finished:false};examIndex=0;save();renderExam();};}
function showPractice(list,title){practiceList=list;$('#practice-questions').innerHTML='<h2>'+title+'</h2>'+list.map(questionHTML).join('');bindQuestions($('#practice-questions'));$('#practice-questions').scrollIntoView({behavior:'smooth',block:'start'});}
function renderExam(){const root=$('#content'),ex=state.exam;clearInterval(clockId);examIndex=Math.min(examIndex,ex.ids.length-1);const q=Q.find(q=>q.id===ex.ids[examIndex]),response=ex.responses[q.id];root.innerHTML=`<div class="page-head"><div class="eyebrow">Timed practice / original questions</div><div class="exam-head"><h1>時間制限演習</h1><span class="timer" id="timer" role="timer"></span></div><p>25問・90分。${ex.scope==='2026'?'現行':'2027改訂'}範囲。解説は提出後に表示します。ブラウザを閉じても制限時間は経過します。</p></div><div class="progress-dots">${ex.ids.map((id,i)=>`<button data-exam-index="${i}" aria-label="問題${i+1}${ex.responses[id]!==undefined?'、解答済み':''}${ex.flags[id]?'、見直し':''}" class="${i===examIndex?'current':''} ${ex.responses[id]!==undefined?'answered':''} ${ex.flags[id]?'flagged':''}">${i+1}</button>`).join('')}</div><div class="q-card" id="exam-question"><div class="q-number"><span>問題 ${examIndex+1} / 25</span><span>${q.type==='mc'?'5肢選択':'数値入力'}</span></div><div class="q-prompt">${q.t}</div>${q.type==='mc'?`<div class="q-options">${q.o.map((o,i)=>`<label class="q-option"><input type="radio" name="exam-choice" value="${i}" ${String(response)===String(i)?'checked':''}><span>${String.fromCharCode(65+i)}. ${escape(o)}</span></label>`).join('')}</div>`:`<div class="q-answer"><label class="sr-only" for="exam-number">数値解答</label><input id="exam-number" type="number" step="any" placeholder="数値を入力" value="${escape(response??'')}"></div>`}<div class="q-action"><button class="btn" id="exam-prev" ${examIndex===0?'disabled':''}>← 前へ</button><button class="btn primary" id="exam-next" ${examIndex===24?'disabled':''}>次へ →</button><label class="small"><input type="checkbox" id="exam-flag" ${ex.flags[q.id]?'checked':''}> 後で見直す</label></div></div><div class="lesson-footer"><span class="small muted" id="exam-count">解答済み ${Object.keys(ex.responses).length} / 25</span><button class="btn primary" id="exam-submit">提出して採点</button></div>`;
const stash=()=>{const input=q.type==='mc'?$('input:checked',$('#exam-question')):$('#exam-number');const value=input?.value;if(value===undefined||value==='')delete ex.responses[q.id];else ex.responses[q.id]=value;save();const current=$('[data-exam-index="'+examIndex+'"]');current.classList.toggle('answered',ex.responses[q.id]!==undefined);$('#exam-count').textContent='解答済み '+Object.keys(ex.responses).length+' / 25';};$$('#exam-question input').forEach(input=>input.addEventListener('change',()=>{if(input.id==='exam-flag'){ex.flags[q.id]=input.checked;save();$('[data-exam-index="'+examIndex+'"]').classList.toggle('flagged',input.checked);}else stash();}));if(q.type==='num')$('#exam-number').addEventListener('input',stash);$$('[data-exam-index]').forEach(b=>b.onclick=()=>{stash();examIndex=+b.dataset.examIndex;renderExam();});$('#exam-prev').onclick=()=>{stash();examIndex--;renderExam();};$('#exam-next').onclick=()=>{stash();examIndex++;renderExam();};$('#exam-submit').onclick=()=>{stash();if(confirm('提出して採点します。未解答は誤答として集計されます。'))finishExam();};const tick=()=>{const remain=Math.max(0,ex.end-Date.now()),sec=Math.ceil(remain/1000);$('#timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(remain<=0)finishExam(true);};tick();if(!ex.finished)clockId=setInterval(tick,1000);}
function finishExam(expired=false){clearInterval(clockId);const ex=state.exam;if(ex.finished)return;ex.finished=true;let count=0;ex.ids.forEach(id=>{const q=Q.find(q=>q.id===id),v=ex.responses[id];if(v!==undefined){record(q,v);if(validateAnswer(q,v))count++;}});ex.score=count;save();$('#content').innerHTML=`<div class="page-head"><div class="eyebrow">Practice result</div><h1>${count}/25問 正答</h1><p>${expired?'制限時間に達したため採点しました。':'演習を提出しました。'} 正答率${pct(count/25)}。公式配点・合格判定とは別の教材内集計です。</p></div><div class="panel"><h3>分野別の確認</h3><div class="table-wrap"><table><thead><tr><th>分野</th><th>正答 / 出題</th></tr></thead><tbody>${eligibleM().filter(m=>ex.ids.some(id=>Q.find(q=>q.id===id).m===m.id)).map(m=>{const ids=ex.ids.filter(id=>Q.find(q=>q.id===id).m===m.id),n=ids.filter(id=>ex.responses[id]!==undefined&&validateAnswer(Q.find(q=>q.id===id),ex.responses[id])).length;return`<tr><td><a href="#${m.id}">${m.title}</a></td><td>${n}/${ids.length}</td></tr>`;}).join('')}</tbody></table></div></div><div class="panel"><h3>全問の解説</h3>${ex.ids.map((id,i)=>{const q=Q.find(q=>q.id===id),v=ex.responses[id],ok=v!==undefined&&validateAnswer(q,v);return`<details class="q-review"><summary class="${ok?'result-ok':'result-bad'}">${i+1}. ${ok?'正答':v===undefined?'未解答':'要復習'} — ${getM(q.m).title}</summary><h3>${q.t}</h3><p>解答：${v===undefined?'未解答':q.type==='mc'?escape(q.o[+v]):escape(v)}</p><p>正答：${q.type==='mc'?escape(q.o[q.a]):q.a}</p><p>${q.e}</p><a href="#${q.m}/lesson">この章を読む</a></details>`;}).join('')}</div><button class="btn primary" id="exam-done" style="margin-top:20px">演習室へ戻る</button>`;$('#exam-done').onclick=()=>{state.exam=null;save();renderPractice();};updateNav();}

document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,b.dataset.tab);if(e.target.id==='export'){const data=JSON.stringify({format:'statlab-v1',...state},null,2);const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='statlab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}if(e.target.id==='reset'&&confirm('この教材の解答・理解チェック・演習記録を初期化しますか？')){state={scope:state.scope,answers:{},learned:{},last:'prob',exam:null};save();render();notify('学習記録を初期化しました。');}});
document.addEventListener('change',e=>{if(e.target.dataset.learned){state.learned[e.target.dataset.learned]=e.target.checked;save();updateNav();}if(e.target.id==='import'){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x.format!=='statlab-v1'||!['2026','2027'].includes(x.scope)||typeof x.answers!=='object'||!x.answers||typeof x.learned!=='object'||!x.learned)throw Error('format');const cleanAnswers={};for(const q of Q){const a=x.answers[q.id];if(a&&typeof a.correct==='boolean'&&typeof a.firstCorrect==='boolean'&&Number.isFinite(Number(a.value)))cleanAnswers[q.id]={value:a.value,correct:validateAnswer(q,a.value),firstCorrect:a.firstCorrect,tries:Math.max(1,Number(a.tries)||1),at:String(a.at||'')};}const cleanLearned={};M.forEach(m=>cleanLearned[m.id]=x.learned[m.id]===true);state={scope:x.scope,answers:cleanAnswers,learned:cleanLearned,last:getM(x.last)?x.last:'prob',exam:null};save();render();notify('学習記録を読み込みました。');}catch(err){notify('この教材から出力した学習記録JSONを選択してください。');}};reader.readAsText(f);}});
$('#scope').addEventListener('change',e=>{if(state.exam&&!state.exam.finished){notify('時間制限演習中は範囲を切り替えられません。');e.target.value=state.scope;return;}state.scope=e.target.value;save();render();});$('#search').addEventListener('input',updateNav);$('#menu').onclick=()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#backdrop').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',String(open));};$('#backdrop').onclick=closeMenu;$('#print').onclick=()=>{$$('.lesson-section').forEach(x=>x.open=true);window.print();};window.addEventListener('hashchange',render);

// SVG plot utility. Each chart keeps its own measured width and visible units.
function plot(el,cfg){const W=Math.max(280,Math.round(el.getBoundingClientRect().width)),H=cfg.square?W-5:cfg.height||290,margin={l:60,r:18,t:20,b:53};const x0=margin.l,x1=W-margin.r,y0=H-margin.b,y1=margin.t;
const xs=cfg.series.flatMap(s=>s.values.map(d=>d.x)),ys=cfg.series.flatMap(s=>s.values.map(d=>d.y));let xd=cfg.xd||[Math.min(...xs),Math.max(...xs)],yd=cfg.yd||[Math.min(0,...ys),Math.max(...ys)];if(xd[0]===xd[1])xd=[xd[0]-1,xd[1]+1];if(yd[0]===yd[1])yd=[yd[0]-1,yd[1]+1];if(!cfg.yd){const pad=(yd[1]-yd[0])*.12;yd=[yd[0]<0?yd[0]-pad:0,yd[1]+pad];}const x=v=>x0+(v-xd[0])/(xd[1]-xd[0])*(x1-x0),y=v=>y0-(v-yd[0])/(yd[1]-yd[0])*(y0-y1),ticks=W<450?3:5;const id='clip-'+Math.random().toString(36).slice(2);let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escape(cfg.aria||cfg.xlabel+'と'+cfg.ylabel)}"><defs><clipPath id="${id}"><rect x="${x0}" y="${y1}" width="${x1-x0}" height="${y0-y1}"/></clipPath></defs>`;
for(let i=0;i<=4;i++){const v=yd[0]+(yd[1]-yd[0])*i/4;svg+=`<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}" stroke="${C.line}"/><text x="${x0-9}" y="${y(v)+4}" text-anchor="end">${tickFmt(v)}</text>`;}for(let i=0;i<=ticks;i++){const v=xd[0]+(xd[1]-xd[0])*i/ticks;svg+=`<text x="${x(v)}" y="${y0+23}" text-anchor="middle">${tickFmt(v)}</text>`;}svg+=`<rect x="${x0}" y="${y1}" width="${x1-x0}" height="${y0-y1}" fill="none" stroke="${C.line}"/><text class="axis-title" x="${(x0+x1)/2}" y="${H-6}" text-anchor="middle">${escape(cfg.xlabel)}</text><text class="axis-title" transform="translate(15 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${escape(cfg.ylabel)}</text><g clip-path="url(#${id})">`;
(cfg.vlines||[]).forEach(v=>svg+=`<line x1="${x(v.x)}" x2="${x(v.x)}" y1="${y1}" y2="${y0}" stroke="${v.color||C.orange}" stroke-width="1.5" stroke-dasharray="5 4"/>`);(cfg.hlines||[]).forEach(v=>svg+=`<line x1="${x0}" x2="${x1}" y1="${y(v.y)}" y2="${y(v.y)}" stroke="${v.color||C.orange}" stroke-dasharray="5 4"/>`);
cfg.series.forEach(s=>{const col=s.color||C.green,vals=s.values;if(s.kind==='bars'){const step=s.step||((xd[1]-xd[0])/Math.max(vals.length,1)),bw=Math.abs(x(xd[0]+step)-x(xd[0]))*.85;vals.forEach(d=>svg+=`<rect x="${x(d.x)-bw/2}" y="${Math.min(y(d.y),y(0))}" width="${bw}" height="${Math.abs(y(d.y)-y(0))}" fill="${d.color||col}" opacity="${s.opacity||.7}"/>`);}else if(s.kind==='points'){vals.forEach(d=>svg+=`<circle cx="${x(d.x)}" cy="${y(d.y)}" r="${s.r||3.2}" fill="${d.color||col}" opacity=".68"/>`);}else if(s.kind==='segments'){vals.forEach(d=>svg+=`<line x1="${x(d.lo)}" x2="${x(d.hi)}" y1="${y(d.y)}" y2="${y(d.y)}" stroke="${d.color||col}" stroke-width="2"/>`);}else{const path=vals.map((d,i)=>(i?'L':'M')+x(d.x)+','+y(d.y)).join(' ');if(s.area){let selected=vals.filter(s.area);if(selected.length>1)svg+=`<path d="M${x(selected[0].x)},${y(0)} ${selected.map(d=>'L'+x(d.x)+','+y(d.y)).join(' ')} L${x(selected[selected.length-1].x)},${y(0)}Z" fill="${col}" opacity=".13"/>`;}svg+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="${s.width||2.2}" ${s.dash?'stroke-dasharray="5 4"':''}/>`;}});
svg+='</g></svg>';el.innerHTML=svg;el._scales={x,y,xd,yd,W,H,x0,x1,y0,y1};}
function tickFmt(x){if(Math.abs(x)<1e-10)return'0';if(Math.abs(x)>=10000)return(x/1000).toFixed(0)+'k';return Number(x.toPrecision(3)).toString();}
function histogram(values,bins=28,range){const lo=range?range[0]:Math.min(...values),hi=range?range[1]:Math.max(...values),w=(hi-lo)/bins,counts=Array(bins).fill(0);values.forEach(v=>{const i=Math.floor((v-lo)/w);if(i>=0&&i<bins)counts[i]++;else if(i===bins)counts[bins-1]++;});return{points:counts.map((c,i)=>({x:lo+(i+.5)*w,y:c/(values.length*w)})),step:w,range:[lo,hi]};}
function curve(lo,hi,f,n=180){return Array.from({length:n+1},(_,i)=>{const x=lo+(hi-lo)*i/n;return{x,y:f(x)};});}
function controls(spec){return spec.map(s=>s.type==='select'?`<label class="control"><span class="control-title">${s.name}</span><select id="${s.id}">${s.options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`:`<label class="control" for="${s.id}"><span class="control-title">${s.name}<output id="${s.id}-out">${s.value}</output></span><input id="${s.id}" type="${s.type||'range'}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}"></label>`).join('');}
function labShell(root,title,sub,spec,extra='',legend=''){root.innerHTML=`<div class="lab-heading"><div><h3>${title}</h3><p>${sub}</p></div></div><div class="controls">${controls(spec)}</div>${extra}<div class="metrics" data-metrics aria-live="polite"></div><div class="chart" data-chart></div>${legend?'<div class="legend">'+legend+'</div>':''}<div class="lab-note" data-note></div><p class="lab-assumptions" data-assumptions></p>`;}
function attach(root,fn){const update=()=>{const p={};$$('.controls input,.controls select',root).forEach(el=>{p[el.id]=el.tagName==='SELECT'?el.value:+el.value;const out=$('#'+el.id+'-out',root);if(out)out.value=el.value;});fn(p);};$$('.controls input,.controls select',root).forEach(el=>el.addEventListener('input',update));root._update=update;update();}
function metrics(root,vals){$('[data-metrics]',root).innerHTML=vals.map(([n,v])=>`<span>${n}<strong>${v}</strong></span>`).join('');}
const note=(root,s,a='')=>{$('[data-note]',root).innerHTML=s;$('[data-assumptions]',root).textContent=a;};

LABS.pca=root=>{labShell(root,'射影方向を変えて分散を測る','母相関行列[[1,ρ],[ρ,1]]から200点を生成。角度はx軸から反時計回り。',[

LABS.markov=root=>{labShell(root,'状態確率を更新する','行確率ベクトル[正常,故障]と2状態の推移行列。',[

LABS.causal=root=>{labShell(root,'交絡による差と調整後の差','C=設備規模、A=省エネ施策、Y=需要。小規模100、大規模200、規模構成は各50%。',[
{id:'largeTreat',name:'大規模設備の施策率（%）',min:5,max:95,step:5,value:80},{id:'treatmentEffect',name:'各規模での施策効果（MW）',min:-30,max:30,step:1,value:-10}
],'<svg style="max-width:420px;width:100%;display:block;margin:auto" viewBox="0 0 420 145" role="img" aria-label="DAG：規模Cから施策Aと需要Yへ、施策Aから需要Yへ矢印"><defs><marker id="arrow-causal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#546969"/></marker></defs><path d="M190 52L96 93M230 52L324 93M130 113H290" fill="none" stroke="#546969" stroke-width="1.7" marker-end="url(#arrow-causal)"/><rect x="156" y="9" width="108" height="40" rx="8" fill="#e6f3ed"/><rect x="26" y="94" width="108" height="40" rx="8" fill="#e6f3ed"/><rect x="286" y="94" width="108" height="40" rx="8" fill="#e6f3ed"/><g fill="#172b2c" font-size="13" text-anchor="middle"><text x="210" y="35">規模 C</text><text x="80" y="120">施策 A</text><text x="340" y="120">需要 Y</text></g></svg><div class="table-wrap" data-causal-table></div>');attach(root,p=>{const t=p.largeTreat/100,d=p.treatmentEffect,obs1=(1-t)*(100+d)+t*(200+d),obs0=t*100+(1-t)*200,raw=obs1-obs0;metrics(root,[['未調整の平均差',fmt(raw,1)+' MW'],['規模で標準化した差',fmt(d,1)+' MW'],['このモデルの真の効果',fmt(d,1)+' MW']]);$('[data-causal-table]',root).innerHTML=`<table><thead><tr><th>規模</th><th>施策率</th><th>施策ありの平均</th><th>施策なしの平均</th><th>層内の差</th></tr></thead><tbody><tr><td>小規模（50%）</td><td>${pct(1-t)}</td><td>${100+d}</td><td>100</td><td>${d}</td></tr><tr><td>大規模（50%）</td><td>${pct(t)}</td><td>${200+d}</td><td>200</td><td>${d}</td></tr></tbody></table>`;plot($('[data-chart]',root),{series:[{kind:'bars',step:1,values:[{x:1,y:raw},{x:2,y:d,color:C.orange}]}],xd:[.5,2.5],yd:[Math.min(-40,raw-15,d-15),Math.max(40,raw+15,d+15)],hlines:[{y:0,color:C.muted}],xlabel:'1：未調整差　2：規模で調整した差',ylabel:'平均需要の差（MW）'});note(root,`施策群は大規模設備を${pct(t)}含み、未施策群は${pct(1-t)}含みます。未調整差は<b>δ+100(2t−1)=${fmt(raw,1)}</b>。両群を共通の50%・50%にそろえると${fmt(d,1)}です。${raw*d<0?'未調整と調整後で差の符号が逆転しています。':''}`,'規模以外に未測定交絡がなく、施策効果は各規模で一定、交換可能性・positivity・consistencyを仮定した数値例。母集団の期待値であり乱数標本ではない。');});};

let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{$$('#lab-main,#lab-extra').forEach(el=>el._update?.());},160);});
window.StatLab={M,Q,SOURCES,LABS,math:{ncdf,nq,logGamma,ibeta,gammaP,fpvalue,chiP,ols,validateAnswer},getState:()=>state};
render();

</script>
</body></html>
